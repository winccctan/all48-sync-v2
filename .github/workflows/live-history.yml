# 直播礼物历史回补（lv:all，room=2）—— 2026-11-25 站长「补全部的」
#
# 逐场拿 getLiveOne 的回放弹幕（.lrc），解析全部有价礼物写 lv:all。
# FORCE=1 忽略已扫游标；已扫场次记在 gift:livecur，超时后重跑会从没扫的开始。
#
# 🔴 2026-11-25：SCRAPE_PROXY 的 home-jp 代理已全部 407 失效 ⇒ 回补改走直连
#    （Actions 出口直连口袋是通的，实测 4 页 3 秒；本机家宽反而被限流）。
#    需要代理时再填 secret，这里显式置空覆盖。
name: 直播礼物历史回补

on:
  workflow_dispatch:
    inputs:
      since:
        description: '起点 YYYY-MM-DD（只接受纯日期，带时间的会变 NaN）'
        default: '2026-05-03'
      until:
        description: '终点 YYYY-MM-DD（不含），留空=不限'
        default: ''
      conc:
        description: '并发（默认 4）'
        default: '4'
      pages:
        description: '翻页数（1 页 20 场；500 页≈1 万场，约够翻到 5 月）'
        default: '600'
      max:
        description: '本轮最多扫几场'
        default: '20000'
      ids:
        description: '定向重跑指定 liveId（逗号/空白分隔），用于重跑失败场次；留空=全量'
        default: ''

permissions:
  contents: read

concurrency:
  group: live-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 回补
        run: node live-gift-sync.mjs
        # 不用 SCRAPE_PROXY（home-jp 代理全 407）；Actions 直连口袋是通的
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          POCKET48_TOKEN: ${{ secrets.POCKET48_TOKEN }}
          LG_SINCE: ${{ inputs.since }}
          LG_UNTIL: ${{ inputs.until }}
          ALL: '1'
          ALL_FORCE: '1'
          LG_PAGES: ${{ inputs.pages }}
          LG_MAX: ${{ inputs.max }}
          LG_CONC: ${{ inputs.conc || '4' }}
          LG_IDS: ${{ inputs.ids }}
